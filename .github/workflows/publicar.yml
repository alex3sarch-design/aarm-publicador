name: Publicar en Instagram

on:
  schedule:
    # Horas en UTC. Ciudad de México = UTC-6 todo el año.
    - cron: "7 15 * * *"    # 9:07 a. m.: prepara y espera hasta las 10:00 / 10:05 / 10:10 (GitHub a veces arranca hasta 40 min tarde)
    - cron: "35 16 * * *"   # 10:35 a. m.: respaldo por si la de las 9:30 no corrió
    - cron: "35 18 * * *"   # 12:35 p. m.: segundo respaldo
  push:
    branches: [main]
    paths: [config.json]    # al activar una semana, se revisa sola
  workflow_dispatch:
    inputs:
      modo:
        description: "revisar = solo revisa las semanas activas · vista = genera vista previa · probar = prueba el permiso de Instagram sin publicar · normal = publica lo de hoy"
        type: choice
        options: [revisar, vista, probar, normal]
        default: revisar
      semana:
        description: "Solo para revisar: semana a revisar sin activarla (ej. Semana 05). Vacío = las activas"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  revisar:
    if: github.event_name == 'push' || inputs.modo == 'revisar'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publicador/requirements.txt
      - run: pip install -r publicador/requirements.txt
      - name: Revisar semanas activas
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SEMANA_REVISAR: ${{ inputs.semana }}
        run: python publicador/publicar.py revisar

  vista:
    if: inputs.modo == 'vista'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publicador/requirements.txt
      - run: pip install -r publicador/requirements.txt
      - name: Generar vista previa
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SEMANA_REVISAR: ${{ inputs.semana }}
        run: python publicador/publicar.py vista
      - name: Entregar vista (rama temporal "vista")
        run: |
          cd _vista
          git init -q -b vista
          git config user.name "aarm-publicador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vista.json && git commit -q -m "Vista previa"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vista

  publicar:
    if: github.event_name == 'schedule' || inputs.modo == 'normal' || inputs.modo == 'probar'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
    outputs:
      hay: ${{ steps.prep.outputs.hay }}
    env:
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      CLAVE_TOKEN: ${{ secrets.CLAVE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo más reciente, no el commit de cuando se disparó
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: publicador/requirements.txt
      - run: pip install -r publicador/requirements.txt
      - name: Configurar git
        run: |
          git config user.name "aarm-publicador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Mantener permiso de Instagram
        if: inputs.modo != 'probar'
        run: python publicador/publicar.py mantener
      - name: Preparar posts de hoy
        id: prep
        run: python publicador/publicar.py ${{ inputs.modo == 'probar' && 'probar-preparar' || 'preparar' }}
      - name: Configurar GitHub Pages
        if: steps.prep.outputs.hay == 'true'
        uses: actions/configure-pages@v5
      - name: Subir imágenes a GitHub Pages
        if: steps.prep.outputs.hay == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar imágenes temporalmente
        if: steps.prep.outputs.hay == 'true'
        uses: actions/deploy-pages@v4
      - name: Publicar en Instagram (en orden)
        if: steps.prep.outputs.hay == 'true'
        run: python publicador/publicar.py ${{ inputs.modo == 'probar' && 'probar' || 'publicar' }}

  limpiar:
    # Retira las imágenes de la dirección pública cuando ya se publicaron (o si algo falló).
    needs: publicar
    if: always() && needs.publicar.outputs.hay == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: mkdir -p vacio && touch vacio/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vacio
          name: github-pages-vacio
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-vacio
